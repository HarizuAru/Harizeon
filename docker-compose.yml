services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harizeon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harizeon}
      POSTGRES_DB: ${POSTGRES_DB:-harizeon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harizeon} -d ${POSTGRES_DB:-harizeon}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Data-plane scan worker (W04). Separate container, NO database credentials —
  # it only reaches Redis and the job payload (§06.1 trust boundary).
  worker:
    build:
      context: ./worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      SCAN_STEP_MS: "500"
      # Sandbox allowlist (comma-separated hosts/addresses). Empty by default;
      # the worker refuses to start with this set when NODE_ENV=production.
      HARIZEON_SANDBOX_HOSTS: ${HARIZEON_SANDBOX_HOSTS:-}
    restart: unless-stopped

  # Intentionally-vulnerable target so scans can be demonstrated end-to-end
  # against a host you own. Started only with `--profile sandbox`.
  sandbox:
    build:
      context: ./sandbox
    profiles: ["sandbox"]
    ports:
      - "127.0.0.1:8081:80"   # localhost only, for manual browsing
    restart: "no"

  # One-shot schema migrator. `docker compose up` builds it (migrations are
  # copied into the image, so no host bind mount is needed), applies pending
  # migrations, then exits. Safe to re-run (already-applied files are skipped).
  migrate:
    build:
      context: ./db
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-harizeon}:${POSTGRES_PASSWORD:-harizeon}@db:5432/${POSTGRES_DB:-harizeon}
    restart: "no"

volumes:
  dbdata:
  redisdata:
