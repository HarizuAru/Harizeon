networks:
  default:
    name: harizeon_default

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harizeon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harizeon}
      POSTGRES_DB: ${POSTGRES_DB:-harizeon}
    # No host port publishing: the database is reachable only inside the compose
    # network (@db:5432). Host-side scripts run inside the api container instead;
    # the native Postgres on the host owns 5432.
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harizeon} -d ${POSTGRES_DB:-harizeon}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Localhost only (§07.5): the broker is control-plane/data-plane internal.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Data-plane scan worker (W04). Separate container, NO database credentials —
  # it only reaches Redis and the job payload (§06.1 trust boundary).
  worker:
    build:
      context: ./worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      SCAN_STEP_MS: "500"
      # Sandbox allowlist (comma-separated hosts/addresses). Empty by default;
      # the worker refuses to start with this set when NODE_ENV=production.
      HARIZEON_SANDBOX_HOSTS: ${HARIZEON_SANDBOX_HOSTS:-}
    restart: unless-stopped

  # Intentionally-vulnerable target so scans can be demonstrated end-to-end
  # against a host you own. Started only with `--profile sandbox`.
  sandbox:
    build:
      context: ./sandbox
    profiles: ["sandbox"]
    ports:
      - "127.0.0.1:8081:80"   # localhost only, for manual browsing
    networks:
      default:
        aliases:
          - sandbox.test      # dotted so it passes domain validation
    restart: "no"

  # One-shot provisioner: apply migrations, then create the non-owner app role.
  # `docker compose up` builds it (files are copied into the image, so no host
  # bind mount is needed), and it's safe to re-run (idempotent).
  migrate:
    build:
      context: .
      dockerfile: db/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-harizeon}:${POSTGRES_PASSWORD:-harizeon}@db:5432/${POSTGRES_DB:-harizeon}
      HARIZEON_APP_PASSWORD: ${HARIZEON_APP_PASSWORD:?set HARIZEON_APP_PASSWORD in .env}
    restart: "no"

  # Control plane (Fastify). Connects as the RLS-restricted app role; owns the
  # database, the scheduler, and the ingest loops.
  api:
    build:
      context: ./api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgresql://harizeon_app:${HARIZEON_APP_PASSWORD:?}@db:5432/${POSTGRES_DB:-harizeon}
      REDIS_URL: redis://redis:6379
      HARIZEON_MASTER_KEY: ${HARIZEON_MASTER_KEY:?set HARIZEON_MASTER_KEY in .env}
      COOKIE_SECURE: "true"
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:8080}
      HARIZEON_RUN_LOOPS: "true"
    restart: unless-stopped

  # Console (Next.js). Proxies /api/v1 to the api service and renders the UI.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        HARIZEON_API_BASE: http://api:8080
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      HARIZEON_API_BASE: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  dbdata:
  redisdata:
