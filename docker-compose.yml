networks:
  control_internal:
    internal: true
  worker_bus:
    internal: true
  public_egress: {}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harizeon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harizeon}
      POSTGRES_DB: ${POSTGRES_DB:-harizeon}
    # No host port publishing: the database is reachable only inside the control_internal
    # network (@db:5432). Host-side scripts run inside the api container instead.
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - control_internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harizeon} -d ${POSTGRES_DB:-harizeon}" ]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    build:
      context: ./infra/redis
      dockerfile_inline: |
        FROM redis:7-alpine
        COPY users.acl /usr/local/etc/redis/users.acl
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--aclfile", "/usr/local/etc/redis/users.acl" ]
    ports:
      # Localhost only: the broker is control-plane/data-plane internal.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - control_internal
      - worker_bus
    healthcheck:
      test: [ "CMD", "redis-cli", "--user", "harizeon_api", "--pass", "${REDIS_API_PASSWORD:-REPLACE_WITH_STRONG_API_REDIS_PASS}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 12

  # Data-plane scan worker (v1.1 Hardened Container).
  # Separate container, ZERO database credentials, read-only root FS, dropped capabilities.
  # Isolated on worker_bus and public_egress; physically cannot connect to postgres (control_internal).
  worker:
    build:
      context: ./worker
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    environment:
      REDIS_URL: redis://harizeon_worker:${REDIS_WORKER_PASSWORD:-REPLACE_WITH_STRONG_WORKER_REDIS_PASS}@redis:6379
      WORKER_ID: worker-01
      HARIZEON_TEMPLATES_DIR: /opt/harizeon/templates
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - worker_bus
      - public_egress
    restart: unless-stopped

  # One-shot provisioner: apply migrations, then create the non-owner app role.
  migrate:
    build:
      context: .
      dockerfile: db/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-harizeon}:${POSTGRES_PASSWORD:-harizeon}@db:5432/${POSTGRES_DB:-harizeon}
      HARIZEON_APP_PASSWORD: ${HARIZEON_APP_PASSWORD:?set HARIZEON_APP_PASSWORD in .env}
    networks:
      - control_internal
    restart: "no"

  # Control plane (Fastify). Connects as the RLS-restricted app role; owns the
  # database, the scheduler, and the ingest loops.
  api:
    build:
      context: ./api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgresql://harizeon_app:${HARIZEON_APP_PASSWORD:?}@db:5432/${POSTGRES_DB:-harizeon}
      REDIS_URL: redis://harizeon_api:${REDIS_API_PASSWORD:-REPLACE_WITH_STRONG_API_REDIS_PASS}@redis:6379
      HARIZEON_MASTER_KEY: ${HARIZEON_MASTER_KEY:?set HARIZEON_MASTER_KEY in .env}
      COOKIE_SECURE: "true"
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:8080}
      HARIZEON_RUN_LOOPS: "true"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - control_internal
      - worker_bus
      - public_egress
    restart: unless-stopped

  # Console (Next.js). Proxies /api/v1 to the api service and renders the UI.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        HARIZEON_API_BASE: http://api:8080
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      HARIZEON_API_BASE: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - control_internal
      - public_egress
    restart: unless-stopped

  # TLS terminator. Auto-issues a Let's Encrypt cert for $DOMAIN once the DNS
  # record points at this host, then forwards everything to the console.
  caddy:
    build:
      context: ./infra/proxy
      dockerfile_inline: |
        FROM caddy:2-alpine
        COPY Caddyfile /etc/caddy/Caddyfile
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:-harizeon.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - control_internal
      - public_egress
    restart: unless-stopped

volumes:
  dbdata:
  redisdata:
  caddy_data:
  caddy_config:
